<!-- Lenis 1.1.13 · MIT · smooth wheel scrolling -->
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
  // 카드는 index.html의 Work 섹션에서 그대로 가져옵니다 (작업물 내용은 한 곳에서만 관리)
  (function () {
    var grid = document.getElementById('arc-grid');
    function boot() { var sc = document.createElement('script'); sc.src = 'assets/js/site.js?v=45'; document.body.appendChild(sc); }
    fetch('index.html', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        // 대표 작업(.wk-feat) 세 개도 포함합니다. 여기서는 일반 카드로 보이도록 넓은 카드 표시와
        // 대표 작업에서만 쓰는 사례 표(.is-case)를 빼고, 짧은 요약(.work-sum)을 보여 줍니다
        var cards = doc.querySelectorAll('#work .wk-list .work');
        grid.textContent = '';
        Array.prototype.forEach.call(cards, function (c) {
          var card = document.importNode(c, true);
          card.classList.remove('work-wide');
          Array.prototype.forEach.call(card.querySelectorAll('.is-case, .work-badge'), function (el) { el.remove(); });
          card.classList.remove('is-feat');
          grid.appendChild(card);
        });
      })
      .catch(function () { var m = grid.querySelector('.arc-empty'); if (m) m.textContent = '작업물을 불러오지 못했어요. 새로고침해 주세요.'; })
      .then(boot);
  })();
</script>

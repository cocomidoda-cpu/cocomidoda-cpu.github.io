<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>김예진 포트폴리오 · 커머스 디자이너</title>
<!-- The address for one job posting: /commerce/ opens the home page as ?for=commerce.
     Paste it into an application with a tag for the channel, e.g. /commerce/?utm_source=saramin&utm_medium=resume&utm_campaign=<company>.
     Without utm_source, the site that sent the visitor becomes the source, because this hop would otherwise hide it from GA4;
     without utm_campaign, the version name is used. This page itself has no GTM, so a visit is counted once, on the home page. -->
<meta name="robots" content="noindex,follow">
<meta name="description" content="같은 상품도 구성에 따라 판매량이 달라지는 것을 상세페이지에서 배웠습니다. 고객이 읽는 순서대로 고민 → 해결 → 근거 → 구매 정보가 이어지게 페이지를 설계합니다.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="김예진 포트폴리오 · 커머스 디자이너">
<meta property="og:description" content="같은 상품도 구성에 따라 판매량이 달라지는 것을 상세페이지에서 배웠습니다. 고객이 읽는 순서대로 고민 → 해결 → 근거 → 구매 정보가 이어지게 페이지를 설계합니다.">
<meta property="og:url" content="https://cocomidoda-cpu.github.io/commerce/">
<meta property="og:image" content="https://cocomidoda-cpu.github.io/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="675">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cocomidoda-cpu.github.io/assets/img/og.jpg">
<link rel="canonical" href="https://cocomidoda-cpu.github.io/">
<script>
  (function () {
    var key = 'commerce', q = new URLSearchParams(location.search), out = new URLSearchParams(), ref = '';
    try { ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, '') : ''; } catch (e) {}
    if (!q.has('utm_source') && ref && ref !== location.hostname) { q.set('utm_source', ref); q.set('utm_medium', 'referral'); }
    if (q.has('utm_source') && !q.has('utm_campaign')) q.set('utm_campaign', key);
    out.set('for', key);
    q.forEach(function (v, k) { if (k !== 'for') out.append(k, v); });
    location.replace('../?' + out.toString() + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=../?for=commerce">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F2EE;color:#08080B;font:500 15px/1.6 system-ui,-apple-system,sans-serif}a{color:inherit}@media (prefers-color-scheme:dark){body{background:#08080B;color:#F4F2EE}}</style>
</head>
<body>
<p><a href="../?for=commerce">김예진 포트폴리오로 이동합니다 →</a></p>
</body>
</html>
